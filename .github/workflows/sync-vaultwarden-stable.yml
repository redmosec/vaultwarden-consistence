name: Sync Vaultwarden stable to registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version such as 1.37.2; leave empty for latest
        required: false
        type: string
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: sync-vaultwarden-stable-to-registry
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REGISTRY: ${{ vars.ACR_REGISTRY }}
      IMAGE: ${{ vars.ACR_IMAGE }}
      REGISTRY_USERNAME: ${{ secrets.ACR_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.ACR_PASSWORD }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REGISTRY" || { echo "Missing variable: ACR_REGISTRY"; exit 1; }
          test -n "$IMAGE" || { echo "Missing variable: ACR_IMAGE"; exit 1; }
          test -n "$REGISTRY_USERNAME" || { echo "Missing secret: ACR_USERNAME"; exit 1; }
          test -n "$REGISTRY_PASSWORD" || { echo "Missing secret: ACR_PASSWORD"; exit 1; }

      - name: Resolve stable version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_VERSION:-}" ]; then
            version="$REQUESTED_VERSION"
          else
            version="$(curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest \
              | jq --exit-status --raw-output '.tag_name')"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Refusing non-stable version: $version"
            exit 1
          }
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        shell: bash
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" \
            --username "$REGISTRY_USERNAME" --password-stdin

      - name: Verify and sync image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          source_image="ghcr.io/dani-garcia/vaultwarden:$VERSION"
          target_image="$REGISTRY/$IMAGE:$VERSION"

          if docker manifest inspect "$target_image" >/dev/null 2>&1; then
            candidate="$target_image"
            result="already existed; not overwritten"
          else
            candidate="$source_image"
            result="synchronized"
          fi

          docker pull --platform linux/amd64 "$candidate"
          actual_version="$(docker image inspect "$candidate" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          actual_platform="$(docker image inspect "$candidate" \
            --format '{{.Os}}/{{.Architecture}}')"
          base_id="$(docker run --rm --entrypoint /bin/sh "$candidate" \
            -c '. /etc/os-release; printf %s "$ID"')"

          test "$actual_version" = "$VERSION"
          test "$actual_platform" = "linux/amd64"
          test "$base_id" = "debian"

          if [ "$candidate" = "$source_image" ]; then
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
          fi

          docker buildx imagetools inspect "$target_image" | tee image-inspect.txt
          digest="$(awk '$1 == "Digest:" {print $2; exit}' image-inspect.txt)"
          test -n "$digest"

          {
            echo "## Vaultwarden image $result"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Platform: \`$actual_platform\`"
            echo "- Base: \`$base_id\`"
            echo "- Target: \`$target_image\`"
            echo "- Digest: \`$digest\`"
            echo
            echo "Production was not contacted or updated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out from registry
        if: always()
        shell: bash
        run: docker logout "$REGISTRY" || true
